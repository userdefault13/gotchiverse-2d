# Local stack without TLS. Use: docker compose -f docker-compose.dev.yml up --build
services:
  realm-server:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 2567
      PUBLIC_URL: http://localhost:2567
    ports:
      - "2567:2567"
